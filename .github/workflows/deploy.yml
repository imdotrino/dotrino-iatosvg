# Deploy de la PWA (web/) a GitHub Pages: iatosvg.dotrino.com (CONVENCIONES §11.3).
# La PWA importa la librería de ../src, así que se hace checkout del repo entero.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "package-lock.json\nweb/package-lock.json" }
      - run: npm install
      # La librería (raíz): sus pruebas y los tipos de las dos partes (el chequeo de la PWA
      # necesita las dependencias de web/, ya instaladas en el paso anterior).
      - run: npm ci
        working-directory: .
      - run: npm test
        working-directory: .
      - run: npm run type-check
        working-directory: .
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
